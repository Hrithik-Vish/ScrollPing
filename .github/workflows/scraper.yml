name: scraper

# Runs one scrape-and-notify pass of main.py.
#
# GitHub's schedule trigger is best effort: runs start late under load (the top of every
# hour is the worst time), a slot can be dropped, and gaps of an hour or more happen.
# That is safe here because every run compares against the database and only notifies
# on a change, so a missed slot just delays detection; it never double-sends.
# Minutes are chosen off the :00 peak on purpose. Cron times are UTC.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:        # "Run workflow" button, for manual runs and testing

permissions:
  contents: read

# One run at a time. If a run is slow, the next one waits instead of overlapping
# (overlapping runs could send the same notification twice). A waiting run is never cancelled.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # database.py insists on all three variables at import; the scraper never uses this one
          SUPABASE_PUBLISHABLE_KEY: "unused-by-the-scraper"