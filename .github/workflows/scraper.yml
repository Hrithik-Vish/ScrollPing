name: scraper
run-name: "scraper (${{ github.event_name }})"

# Runs one scrape-and-notify pass of main.py.
#
# TRIGGERS
#   workflow_dispatch  the PRIMARY trigger: cron-job.org calls GitHub's API once an hour
#                      (minute 5). API-started runs skip the queue that delays and drops
#                      GitHub's own scheduled runs, and this is also the "Run workflow" button.
#   schedule           a BACKUP at minute 35 of every hour. GitHub's schedule is best effort
#                      (late starts, dropped slots, and it is switched off after 60 days
#                      without repository activity), so it only has to catch the odd miss.
#                      "scraper (schedule)" vs "scraper (workflow_dispatch)" in the run list
#                      shows which trigger started a run. Cron times are UTC.
#
# Running twice an hour is safe: every run compares against the database and only notifies
# on a change, so a second run right after the first finds nothing new and never double-sends.
on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: read

# One run at a time. If a run is slow, the next one waits instead of overlapping
# (overlapping runs could send the same notification twice). A waiting run is never cancelled.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # database.py insists on all three variables at import; the scraper never uses this one
          SUPABASE_PUBLISHABLE_KEY: "unused-by-the-scraper"